[project]
name = "niwrap-workshop"
version = "2026.10.0"
description = "Hands-on NiWrap workshop: Python wrappers for neuroimaging command-line tools"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  # NiWrap and the Styx runtime (runners)
  "niwrap==1.1.0",
  "styxkit==0.1.0",
  "styxdefs==0.7.0",
  "styxdocker==0.8.0",
  "styxpodman==0.3.0",
  "styxsingularity==0.9.0",
  "styxgraph==0.7.0",
  # Workflow engine for the "scaling up" section
  "snakemake==9.27.0",
  # Notebooks and viewing results
  "ipykernel>=7.4.0",
  "jupyterlab>=4.6.4",
  "matplotlib>=3.11.0",
  "nilearn>=0.13.1",
]

[dependency-groups]
dev = [
  "nbclient>=0.11.0",
  "nbformat>=5.11.1",
]

[tool.uv]
package = false
